name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo +stable fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: stable-clippy
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: protoc@3.35.1
          fallback: none
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-test
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: protoc@3.35.1,cargo-nextest@0.9.137
          fallback: none
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.108.0
      - run: cargo +1.88.0 nextest run --locked --workspace --all-targets --all-features --profile ci

  stable:
    name: latest-stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: latest-stable-check
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: protoc@3.35.1
          fallback: none
      - run: cargo +stable check --locked --workspace --all-targets --all-features

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: protoc@3.35.1,cargo-deny@0.20.2,cargo-machete@0.9.1
          fallback: none
      - name: Install taskit
        run: cargo +stable install --locked taskit --version 0.9.0
      - run: cargo deny check
      - run: taskit check deps
      - run: taskit protocol drift

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: stable-coverage
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: protoc@3.35.1,cargo-nextest@0.9.137,cargo-llvm-cov@0.8.7
          fallback: none
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.108.0
      - name: Generate workspace coverage
        run: cargo +stable llvm-cov nextest --locked --workspace --all-features --lcov --output-path lcov.info
      - name: Record comparable workspace coverage
        run: scripts/ci/coverage-summary.sh lcov.info workspace-coverage.json "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-coverage-${{ github.sha }}
          path: workspace-coverage.json
          if-no-files-found: error
          retention-days: 90
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: true

  workflow-contracts:
    name: workflow-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: actionlint@1.7.7,shellcheck@0.11.0
          fallback: none
      - name: Lint workflows and shell scripts
        run: |
          actionlint
          git ls-files 'scripts/*.sh' 'scripts/**/*.sh' | xargs shellcheck
      - name: Run workflow and site contract tests
        run: |
          scripts/tests/release-health.sh
          scripts/tests/workflow-contracts.sh
          scripts/tests/site-smoke.sh

  workflow-contracts-windows:
    name: workflow-contracts-windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise Windows package success and failure paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp | Out-Null
          Set-Content -Encoding ascii tmp/looprs.exe 'binary'
          Set-Content -Encoding ascii tmp/README.md '# test'
          Set-Content -Encoding ascii tmp/LICENSE 'license'
          scripts/ci/package-release-windows.ps1 -Binary tmp/looprs.exe -Readme tmp/README.md -License tmp/LICENSE -Output tmp/looprs.zip
          if (-not (Test-Path tmp/looprs.zip) -or -not (Test-Path tmp/looprs.zip.sha256)) { throw 'package outputs missing' }
          try {
            scripts/ci/package-release-windows.ps1 -Binary tmp/missing.exe -Readme tmp/README.md -License tmp/LICENSE -Output tmp/missing.zip
            throw 'missing binary unexpectedly packaged'
          } catch {
            if ($_.Exception.Message -notlike '*required package input is missing*') { throw }
          }

  required:
    name: required
    if: always()
    needs: [fmt, clippy, msrv, stable, dependency-policy, coverage, workflow-contracts, workflow-contracts-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          STABLE_RESULT: ${{ needs.stable.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-contracts.result }}
          WINDOWS_WORKFLOW_RESULT: ${{ needs.workflow-contracts-windows.result }}
        run: |
          for result in "$FMT_RESULT" "$CLIPPY_RESULT" "$MSRV_RESULT" "$STABLE_RESULT" "$DEPENDENCY_RESULT" "$COVERAGE_RESULT" "$WORKFLOW_RESULT" "$WINDOWS_WORKFLOW_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job finished with status: $result" >&2
              exit 1
            fi
          done
