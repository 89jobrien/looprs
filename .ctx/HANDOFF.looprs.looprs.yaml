- id: hex-phase-3
  doob_uuid: 0bbe5497-24f7-4211-899c-bd1871c5c705
  name: hex-phase-3
  priority: P2
  status: done
  title: 'Hex Phase 3: inject SessionStore construction out of Agent'
  description: |
    Agent constructs its own SessionStore internally. Phase 3 moves this to
    the composition root (looprs-cli/main.rs) so the store is injected.
    SQLite and Fs backends already exist; the factory fn default_session_store()
    is in adapters/mod.rs. new_with_runtime() already accepts
    Option<Box<dyn SessionStore>>, so the wiring is the main remaining gap.
    See TODO in crates/looprs-core/src/ports/session_store.rs.
  files:
  - crates/looprs/src/agent.rs
  - crates/looprs/src/adapters/mod.rs
  - crates/looprs-cli/src/main.rs
  extra: []
- id: streaming-openai
  doob_uuid: 130d7038-a395-4324-aa71-a1f5817eb1d9
  name: streaming-openai
  priority: P3
  status: done
  title: Extend real SSE streaming to openai.rs and openai_sdk.rs
  description: |
    AnthropicProvider has real infer_stream() via reqwest SSE.
    OpenAIProvider and OpenAISdkProvider still use the default single-chunk
    fallback. OpenAI SSE format: data: {"choices":[{"delta":{"content":"..."}}]}.
    async-openai SDK exposes create_stream() on chat completions.
  files:
  - crates/looprs/src/providers/openai.rs
  - crates/looprs/src/providers/openai_sdk.rs
  extra:
  - date: 2026-08-25
    type: discovery
    note: Implemented infer_stream + supports_streaming for openai and openai-sdk providers, with unit tests for stream delta extraction and streaming support flags. Verification blocked by existing compile error in crates/looprs/src/doob.rs test fixture (invalid JSON string literal at line ~205).
  - date: 2026-08-25
    type: note
    note: 'Verification unblocked: fixed pre-existing doob.rs test JSON literal + cfg(test) import/lint issues. OpenAI provider subset passes in nextest (13/13) and clippy -D warnings for crate looprs is clean.'
- id: parallel-dispatch
  doob_uuid: 89de3f10-bd12-4cf6-a9d1-380fc0c44826
  name: parallel-dispatch
  priority: P3
  status: blocked
  title: Parallel tool dispatch via tokio::task::JoinSet
  description: |
    run_turn() dispatches tool calls sequentially. When the LLM emits multiple
    independent tool_use blocks in one response, they could be dispatched in
    parallel. AgentsConfig.max_parallel is loaded (default 3). Guard with
    agents.orchestration = "parallel" config flag; keep sequential as default.
    Blocked on: stable AgentBuilder and AgentRuntime Clone impls.
    See TODO comment in agent.rs around line 370.
  files:
  - crates/looprs/src/agent.rs
  - crates/looprs/src/app_config.rs
  extra:
  - date: 2026-08-25
    type: blocker
    note: Blocked until parallel-safe agent runtime construction path is available (cloneable runtime/builder or equivalent spawnable constructor). Do not start implementation until unblock criterion is met and documented.
