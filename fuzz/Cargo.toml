[package]
name = "looprs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
looprs = { path = "../crates/looprs" }
looprs-core = { path = "../crates/looprs-core" }
serde_json = "1"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "fuzz_strip_ansi"
path = "fuzz_targets/fuzz_strip_ansi.rs"
doc = false

[[bin]]
name = "fuzz_parse_skill"
path = "fuzz_targets/fuzz_parse_skill.rs"
doc = false

[[bin]]
name = "fuzz_parse_hook"
path = "fuzz_targets/fuzz_parse_hook.rs"
doc = false

[[bin]]
name = "fuzz_parse_session_event"
path = "fuzz_targets/fuzz_parse_session_event.rs"
doc = false

[[bin]]
name = "fuzz_parse_content_block"
path = "fuzz_targets/fuzz_parse_content_block.rs"
doc = false
