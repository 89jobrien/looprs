[tools]
rust = "latest"

[tasks.build]
description = "Build the project in release mode"
run = "make build"

[tasks.build-release]
description = "Build the project in release mode"
run = "make build"

[tasks.dev]
description = "Build the project in debug mode"
run = "make dev"

[tasks.test]
description = "Run library tests"
run = "make test"

[tasks."test:all"]
description = "Run all tests including integration targets"
run = "make test-all"

[tasks.lint]
description = "Run clippy linter with warnings denied"
run = "make lint"

[tasks.format]
description = "Format code with rustfmt"
run = "make fmt"

[tasks."fmt:check"]
description = "Check formatting without modifying files"
run = "make fmt-check"

[tasks.check]
description = "Quick compile check without building"
run = "make check"

[tasks.clean]
description = "Remove build artifacts"
run = "make clean"

[tasks.install]
description = "Build and install the looprs binary locally"
run = "cargo xtask install"

[tasks.run]
description = "Run compiled looprs binary"
run = "make run"

[tasks.start]
description = "Start looprs CLI in debug mode"
run = "cargo run --bin looprs"

[tasks.ui]
description = "Start desktop UI application"
run = "cargo run -p looprs-desktop"

[tasks."start:everything"]
description = "Build workspace and launch desktop UI (main app)"
run = "cargo build --workspace && cargo run -p looprs-desktop"

[tasks.watch]
description = "Watch for changes and run checks"
run = "make watch"

[tasks.setup]
description = "Install development dependencies"
run = "make setup"

[tasks.ci]
description = "Run CI verification checks"
run = "make ci"

[tasks."verify:all"]
description = "Run all local verification checks"
run = "make all"

[tasks.validate]
description = "Run a looprs-driven validation sweep over the given files"
run = "nu scripts/validation-sweep.nu"

[tasks.demo]
description = "Run looprs with a canned demo prompt against the OpenAI provider"
run = "nu scripts/demo.nu"

[tasks.provider]
description = "Launch the interactive provider/model selection TUI"
run = "cargo run --bin looprs -- provider"

[tasks.tui]
description = "Launch the alternate chat TUI"
run = "cargo run --bin looprs -- tui"

[env]
RUST_BACKTRACE = "1"
